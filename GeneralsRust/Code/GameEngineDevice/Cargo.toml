[package]
name = "game_engine_device_archive"
version = "0.1.0"
edition = "2021"
description = "Leftover Device tree: default = workspace GameClient wgpu re-export (archive stays on disk)"
license = "GPL-3.0"
authors = ["Claude Code"]

[lib]
name = "game_engine_device_archive"
path = "src/wgpu_workspace_shim.rs"

[dependencies]
game_engine_device = { path = "../GameEngine/GameEngineDevice" }
game_client = { path = "../GameEngine/GameClient", package = "game-client-rust" }

[features]
default = []
# Extra leftover wgpu wrappers (tracer/ray/tree atlas). Not a D3D/Miles revival.
legacy-full = []
