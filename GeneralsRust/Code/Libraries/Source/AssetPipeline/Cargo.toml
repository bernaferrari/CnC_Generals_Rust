[package]
name = "asset_pipeline"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
authors = ["GeneralsRust Team"]
description = "Modern asset pipeline replacing Max4SDK with advanced import/export and processing capabilities"
license = "GPL-3.0"
repository = "https://github.com/GeneralsRust/AssetPipeline"

[features]
default = ["importers", "processors", "exporters", "gpu_processing", "batch_processing"]
importers = ["gltf", "obj"]
processors = []
exporters = []
gpu_processing = ["wgpu"]
batch_processing = ["rayon", "tokio"]
3ds_max_integration = []
blender_integration = []
maya_integration = []

[dependencies]
# Core dependencies
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
thiserror = {workspace = true}
anyhow = {workspace = true}
uuid = {workspace = true, features = ["v4", "serde"]}
chrono = {workspace = true, features = ["serde"]}

# File I/O and formats
image = {workspace = true, features = ["png", "jpeg", "tga", "dds"]}
tiff = {workspace = true}
png = {workspace = true}
jpeg-decoder = {workspace = true}

# 3D formats
gltf = {workspace = true, optional = true}
obj = {workspace = true, optional = true}

# Mesh processing
meshopt = {workspace = true}
glam = {workspace = true}
ultraviolet = {workspace = true}

# GPU processing
wgpu = {workspace = true, optional = true}

# Parallel processing
rayon = {workspace = true, optional = true}
tokio = {workspace = true, features = ["full"], optional = true}
futures = {workspace = true}
async-trait = {workspace = true}

# Compression
zstd = {workspace = true}
lz4_flex = {workspace = true}
eac_compression = { path = "../Compression/EAC" }

# Text processing and scripting
regex = {workspace = true}
toml = {workspace = true}
yaml-rust = {workspace = true}

# Progress tracking
indicatif = {workspace = true}

# Utilities
log = {workspace = true}
env_logger = {workspace = true}
memmap2 = {workspace = true}
walkdir = {workspace = true}
globset = {workspace = true}
num_cpus = {workspace = true}

# Platform specific (optional)
[target.'cfg(windows)'.dependencies]
winapi = { workspace = true, features = ["winuser", "combaseapi"], optional = true }

# Math and geometry
ncollide3d = { workspace = true }
parry3d = { workspace = true }

[dev-dependencies]
criterion = {workspace = true, features = ["html_reports"]}
tempfile = {workspace = true}
approx = {workspace = true}