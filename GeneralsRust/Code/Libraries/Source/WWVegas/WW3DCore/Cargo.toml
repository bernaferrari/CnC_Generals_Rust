[package]
name = "ww3d_core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Core W3D format types, constants, and errors reused across WW3D crates"
license = "GPL-3.0"

[lib]
name = "ww3d_core"
path = "src/lib.rs"

[dependencies]
thiserror = {workspace = true}
bytemuck = {workspace = true, features = ["derive"]}
serde = {workspace = true, features = ["derive"]}
math_utilities = { path = "../WWMath" }

