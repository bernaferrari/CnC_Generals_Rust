[package]
name = "wwshade"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Converted from C++ WWShade library"]
description = "Rust port of the WWShade graphics/shader library from Command & Conquer Generals Zero Hour"
license = "GPL-3.0"

[dependencies]
bincode_legacy = { workspace = true }
# Graphics and math libraries
wgpu = {workspace = true, features = ["wgsl"]}
ww3d-gpu = { path = "../WW3D2/crates/ww3d-gpu" }
ww3d-engine = { path = "../WW3D2/crates/ww3d-engine" }
bytemuck = {workspace = true, features = ["derive"]}
glam = {workspace = true, features = ["serde"]}
bitflags = {workspace = true}

# String and container utilities
thiserror = {workspace = true}
anyhow = {workspace = true}
log = {workspace = true}

# Serialization for save/load functionality
serde = {workspace = true, features = ["derive"]}
bincode = {workspace = true}

# Memory management
parking_lot = {workspace = true}
once_cell = {workspace = true}
# Async support
async-trait = {workspace = true}

# For including shader source files
include_dir = {workspace = true}

# Window management (optional)
winit = {workspace = true, optional = true}

# Modern async runtime (optional, for examples)
tokio = {workspace = true, features = ["full"], optional = true}

# Logging
env_logger = {workspace = true, optional = true}

[dev-dependencies]
env_logger = {workspace = true}
tokio = {workspace = true, features = ["full"]}

[features]
default = []
examples = ["tokio", "env_logger"]  # Example dependencies

[[example]]
name = "modern_rendering"
required-features = ["examples"]

[[example]]
name = "api_compatibility"
required-features = ["examples"]

[[example]]
name = "shader_access"
path = "examples/shader_access.rs"
