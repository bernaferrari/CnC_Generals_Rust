[package]
name = "ww_save_load"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "WWSaveLoad - Westwood Studios Save/Load System - Rust conversion"
authors = ["Westwood Studios", "Community Contributors"]
license = "GPL-3.0"

[dependencies]
# External dependencies
thiserror = {workspace = true}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
bitvec = {workspace = true}
parking_lot = {workspace = true}
log = {workspace = true}

# Internal WWVegas dependencies (commented out due to compilation issues)
# base_types = { path = "../WWLib/base_types" }
# string_system = { path = "../WWLib/string_system" }

[dev-dependencies]
criterion = {workspace = true}

[[bench]]
name = "saveload_benchmarks"
harness = false

[lib]
name = "ww_save_load"
crate-type = ["rlib"]

[features]
default = ["debug"]
debug = []
chunk-validation = []

