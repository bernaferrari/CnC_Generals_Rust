[package]
name = "profile"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Performance profiling library - Rust conversion of C++ profile library for Command & Conquer Generals Zero Hour"
authors = ["C&C Generals Zero Hour Rust Project"]

[dependencies]
# Core dependencies
thiserror = {workspace = true}
log = {workspace = true}

# Synchronization and threading
parking_lot = {workspace = true}
crossbeam = {workspace = true}

# Collections
dashmap = {workspace = true}

# Time handling
once_cell = {workspace = true}
backtrace = {workspace = true}
chrono = { workspace = true, features = ["clock", "std"] }

# For CPU cycle counting
raw-cpuid = {workspace = true}

# System interface
libc = {workspace = true}

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio-test = {workspace = true}
criterion = {workspace = true}

[features]
default = ["function-level", "high-level"]
function-level = []
high-level = []
debug = []
internal = []
