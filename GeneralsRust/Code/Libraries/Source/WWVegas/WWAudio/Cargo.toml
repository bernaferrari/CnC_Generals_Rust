[package]
name = "wp-audio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Westwood Studios", "Community Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-repo/cnc-generals-zero-hour"
description = "WestWood Studios Audio Library - Rust conversion of the original WPAudio C++ library"
keywords = ["audio", "gaming", "westwood", "cnc", "directsound"]
categories = ["multimedia::audio", "game-development"]
readme = "README.md"

[lib]
name = "wp_audio"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
examples = []
internal = []

# Audio backend features
directsound = ["dep:windows", "dep:winapi"]
alsa = ["dep:alsa"]
pulseaudio = ["dep:pulse"] 
coreaudio = ["dep:coreaudio-rs", "dep:core-foundation"]

# Codec features  
mp3 = ["symphonia/mp3"]
wav = ["symphonia/wav"]
adpcm = []

# Platform features
windows-native = ["dep:windows", "dep:winapi"]
debug-output = []
profiling = []

[dependencies]
# Workspace dependencies
wpaudio-shared = { path = "../../WPAudio/shared" }
cpal = {workspace = true}
tokio = {workspace = true, features = ["full"]}
async-trait = {workspace = true}
crossbeam-channel = {workspace = true}
num_cpus = {workspace = true}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
directories = {workspace = true}
thiserror = {workspace = true}
anyhow = {workspace = true}
log = {workspace = true}

# Audio-specific dependencies
symphonia = {workspace = true, features = ["wav", "mp3"]}
parking_lot = {workspace = true}

# Platform-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation"
]}
winapi = { workspace = true, optional = true, features = ["winuser", "mmsystem", "dsound"] }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { workspace = true, optional = true }
pulse = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { workspace = true, optional = true }
core-foundation = { workspace = true, optional = true }

[dev-dependencies]
criterion = {workspace = true}
proptest = {workspace = true}
mockall = {workspace = true}
tokio-test = {workspace = true}

[[bench]]
name = "audio_benchmarks"
harness = false

[build-dependencies]
cc = {workspace = true}

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = "allow"
unused = "allow"
dead_code = "allow"
nonstandard_style = "allow"
deprecated = "allow"

[lints.clippy]
all = "allow"
pedantic = "allow"
nursery = "allow"
cargo = "allow"
restriction = "allow"
