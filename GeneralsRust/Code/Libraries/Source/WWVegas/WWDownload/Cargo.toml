[package]
name = "wwdownload"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "WWDownload - Modern download library for Command & Conquer Generals Zero Hour"
license = "GPL-3.0"
authors = ["Electronic Arts Inc."]

[dependencies]
# Async runtime
tokio = {workspace = true, features = ["full"]}

# FTP client
suppaftp = { workspace = true, features = ["tokio", "native-tls", "async-secure"] }

# HTTP client for HTTP downloads
reqwest = {workspace = true, features = ["stream", "json"]}

# Error handling
thiserror = {workspace = true}
anyhow = {workspace = true}

# Async traits and utilities
async-trait = {workspace = true}
futures = {workspace = true}

# File system operations
tokio-util = {workspace = true, features = ["io"]}

# Progress tracking
indicatif = {workspace = true}

# Logging
log = {workspace = true}
tracing = {workspace = true}
tracing-subscriber = {workspace = true, features = ["env-filter"]}

# Cross-platform configuration storage
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
dirs = {workspace = true}

# URL parsing and building
url = {workspace = true}

# Retry logic
backoff = {workspace = true, features = ["tokio"]}

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_System_Registry"] }

[dev-dependencies]
tokio-test = {workspace = true}
tempfile = {workspace = true}
