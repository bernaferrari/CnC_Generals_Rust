[package]
name = "ww3d-renderer-3d"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
ww3d-core = { path = "../ww3d-core" }
ww3d-assets = { path = "../ww3d-assets" }
ww3d-collision = { path = "../ww3d-collision" }
ww3d-gpu = { path = "../ww3d-gpu" }
ww3d-engine = { path = "../ww3d-engine" }
ww3d-geometry = { path = "../ww3d-geometry" }
ww3d-particles = { path = "../ww3d-particles" }
ww3d-animation = { path = "../ww3d-animation" }
math_utilities = { path = "../../../WWMath" }
glam = {workspace = true, features = ["bytemuck"]}
wgpu = {workspace = true}
pollster = {workspace = true}
bytemuck = {workspace = true, features = ["derive"]}
bcdec_rs = {workspace = true}
binrw = {workspace = true}
lazy_static = {workspace = true}
crc32fast = {workspace = true}
bitflags = {workspace = true}
image = {workspace = true}
raw-window-handle = {workspace = true}
thiserror = {workspace = true}
log = {workspace = true}
serde = {workspace = true, features = ["derive"], optional = true}
serde_json = {workspace = true, optional = true}
naga = { workspace = true, features = ["spv-in", "wgsl-out"] }

[dev-dependencies]
tokio = {workspace = true, features = ["full"]}
criterion = {workspace = true, features = ["html_reports"]}

[features]
default = []
serde_support = ["serde", "serde_json"]
debug_logging = []

[[bench]]
name = "rendering_effects_bench"
harness = false

[[bench]]
name = "uv_mapper_bench"
harness = false
