[package]
name = "ww3d-geometry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "WW3D Geometry Engine - Mesh geometry, collision detection, and spatial partitioning"

[dependencies]
ww3d-core = { path = "../ww3d-core" }
glam = {workspace = true, features = ["bytemuck"]}
bytemuck = {workspace = true, features = ["derive"]}
thiserror = {workspace = true}
bitflags = {workspace = true}
ww3d-assets = { path = "../ww3d-assets", optional = true }
binrw = {workspace = true}
rand = {workspace = true}

wgpu = { workspace = true, optional = true }

[features]
default = []
wgpu = ["dep:wgpu"]
assets-bridge = ["dep:ww3d-assets"]
