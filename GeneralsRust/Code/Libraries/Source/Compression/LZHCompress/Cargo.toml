[package]
name = "lzh_compression"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
authors = ["GeneralsRust Team"]
description = "Modern Rust implementation of LZH compression algorithm with SIMD and GPU acceleration"
license = "GPL-3.0"
repository = "https://github.com/GeneralsRust/LZHCompress"

[features]
default = ["simd", "parallel"]
simd = ["wide"]
parallel = ["rayon"]
benchmarks = ["criterion"]
gpu_acceleration = ["wgpu", "bytemuck"]
dictionary_compression = ["lz4_flex"]
internal = []

[dependencies]
# Core dependencies
thiserror = {workspace = true}
anyhow = {workspace = true}
byteorder = {workspace = true}
crc32fast = {workspace = true}
memmap2 = {workspace = true}

# SIMD optimizations
wide = {workspace = true, optional = true}

# Parallel processing
rayon = {workspace = true, optional = true}

# Advanced compression
lz4_flex = {workspace = true, optional = true}

# GPU acceleration
wgpu = {workspace = true, optional = true}
bytemuck = {workspace = true, features = ["derive"], optional = true}

# Benchmarking
criterion = {workspace = true, optional = true}

# Utilities
log = {workspace = true}
env_logger = {workspace = true}

[dev-dependencies]
criterion = {workspace = true, features = ["html_reports"]}
proptest = {workspace = true}
tempfile = {workspace = true}
rand = {workspace = true}

[[bench]]
name = "lzh_benchmarks"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "dictionary_benchmarks"
harness = false
required-features = ["benchmarks", "dictionary_compression"]
