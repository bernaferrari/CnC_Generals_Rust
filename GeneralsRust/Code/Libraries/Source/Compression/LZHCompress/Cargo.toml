[package]
name = "lzh_compression"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true

authors = ["GeneralsRust Team"]
description = "Modern Rust implementation of LZH compression algorithm with SIMD and parallel acceleration"
license = "GPL-3.0"
repository = "https://github.com/GeneralsRust/LZHCompress"

[lints]
workspace = true

[features]
default = ["simd", "parallel"]
simd = ["wide"]
parallel = ["rayon"]
benchmarks = ["criterion"]
dictionary_compression = []
internal = []

[dependencies]
# Core dependencies
thiserror = {workspace = true}
crc32fast = {workspace = true}

# SIMD optimizations
wide = {workspace = true, optional = true}

# Parallel processing
rayon = {workspace = true, optional = true}

# Benchmarking
criterion = {workspace = true, optional = true}

# Utilities
log = {workspace = true}

[dev-dependencies]
criterion = {workspace = true, features = ["html_reports"]}
proptest = {workspace = true}

[[bench]]
name = "lzh_benchmarks"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "dictionary_benchmarks"
harness = false
required-features = ["benchmarks", "dictionary_compression"]
