[package]
name = "zlib_compression"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
authors = ["GeneralsRust Team"]
description = "Modern Rust implementation of ZLib compression with DEFLATE/INFLATE algorithms"
license = "GPL-3.0"
repository = "https://github.com/GeneralsRust/ZLib"

[features]
default = ["simd", "parallel", "streaming"]
simd = ["wide"]
parallel = ["rayon"]
streaming = ["tokio"]
benchmarks = ["criterion"]
gpu_acceleration = ["wgpu", "bytemuck"]
custom_dictionary = ["lz4_flex"]
internal = []

[dependencies]
# Core dependencies
thiserror = {workspace = true}
anyhow = {workspace = true}
byteorder = {workspace = true}
crc32fast = {workspace = true}
adler32 = {workspace = true}
memmap2 = {workspace = true}

# SIMD optimizations
wide = {workspace = true, optional = true}

# Parallel processing
rayon = {workspace = true, optional = true}

# Async streaming
tokio = {workspace = true, features = ["full"], optional = true}
futures = {workspace = true}

# Advanced compression
lz4_flex = {workspace = true, optional = true}

# GPU acceleration
wgpu = {workspace = true, optional = true}
bytemuck = {workspace = true, features = ["derive"], optional = true}

# Benchmarking
criterion = {workspace = true, optional = true}

# Utilities
log = {workspace = true}
env_logger = {workspace = true}
bit-vec = {workspace = true}

[dev-dependencies]
criterion = {workspace = true, features = ["html_reports"]}
proptest = {workspace = true}
tempfile = {workspace = true}
rand = {workspace = true}

[[bench]]
name = "zlib_benchmarks"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "deflate_benchmarks"
harness = false
required-features = ["benchmarks", "simd"]
