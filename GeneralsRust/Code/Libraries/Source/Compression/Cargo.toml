[package]
name = "generals_compression"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
authors = ["GeneralsRust Team"]
description = "Modern Rust implementation of Command & Conquer Generals Zero Hour compression algorithms"
license = "GPL-3.0"
repository = "https://github.com/GeneralsRust/Compression"

[features]
default = ["parallel", "benchmarks"]
parallel = ["rayon"]
benchmarks = ["criterion"]

[dependencies]
# All compression algorithms now use battle-tested libraries - no custom implementations!

# Core dependencies
thiserror = {workspace = true}
anyhow = {workspace = true}
byteorder = {workspace = true}
rayon = {workspace = true, optional = true}
log = {workspace = true}
env_logger = {workspace = true}
serde = {workspace = true, features = ["derive"]}

# Battle-tested compression libraries
lz4_flex = {workspace = true}     # Fast LZ4 compression (replaces RefPack)
flate2 = {workspace = true}        # DEFLATE/INFLATE (replaces custom ZLib)
zstd = {workspace = true}         # Zstandard (replaces BTree)
brotli = {workspace = true}        # Brotli (replaces Huffman)
eac_compression = { path = "EAC" }
lzh_compression = { path = "LZHCompress" }

# Benchmarking
criterion = {workspace = true, optional = true}

[dev-dependencies]
criterion = {workspace = true, features = ["html_reports"]}
proptest = {workspace = true}
tempfile = {workspace = true}
rand = {workspace = true}

[[bench]]
name = "compression_benchmarks"
harness = false
required-features = ["benchmarks"]


