[package]
name = "eac_compression"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true

authors = ["GeneralsRust Team"]
description = "Modern Rust implementation of EA Compression (EAC) algorithms"
license = "GPL-3.0"
repository = "https://github.com/GeneralsRust/EAC"

[lints]
workspace = true

[features]
default = ["simd"]
simd = []
benchmarks = ["criterion"]
internal = []

[dependencies]
# Core dependencies
thiserror = {workspace = true}
rayon = {workspace = true}

# Benchmarking
criterion = {workspace = true, optional = true}

# Utilities
log = {workspace = true}

[dev-dependencies]
criterion = {workspace = true, features = ["html_reports"]}
proptest = {workspace = true}

[[bench]]
name = "compression_benchmarks"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "simd_benchmarks" 
harness = false
required-features = ["simd", "benchmarks"]
