[package]
name = "eac_compression"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
authors = ["GeneralsRust Team"]
description = "Modern Rust implementation of EA Compression (EAC) algorithms with SIMD optimizations"
license = "GPL-3.0"
repository = "https://github.com/GeneralsRust/EAC"

[features]
default = ["simd", "streaming"]
simd = ["wide"]
streaming = ["tokio"]
benchmarks = ["criterion"]
gpu_acceleration = ["wgpu", "bytemuck"]
internal = []

[dependencies]
# Core dependencies
thiserror = {workspace = true}
anyhow = {workspace = true}
byteorder = {workspace = true}
crc32fast = {workspace = true}
rayon = {workspace = true}
memmap2 = {workspace = true}

# SIMD optimizations
wide = {workspace = true, optional = true}

# Async streaming
tokio = {workspace = true, features = ["full"], optional = true}
futures = {workspace = true}

# GPU acceleration
wgpu = {workspace = true, optional = true}
bytemuck = {workspace = true, features = ["derive"], optional = true}

# Benchmarking
criterion = {workspace = true, optional = true}

# Utilities
log = {workspace = true}
env_logger = {workspace = true}

[dev-dependencies]
criterion = {workspace = true, features = ["html_reports"]}
proptest = {workspace = true}
tempfile = {workspace = true}
tokio-test = {workspace = true}

[[bench]]
name = "compression_benchmarks"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "simd_benchmarks" 
harness = false
required-features = ["simd", "benchmarks"]
