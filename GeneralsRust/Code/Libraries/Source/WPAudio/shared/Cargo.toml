[package]
name = "wpaudio-shared"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Westwood Studios", "Community Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-repo/cnc-generals-zero-hour"
description = "Shared utilities for WestWood Studios library conversions"
keywords = ["utilities", "westwood", "cnc", "gamedev"]
categories = ["game-development", "data-structures"]

[lib]
name = "shared"

[dependencies]
serde = {workspace = true, features = ["derive"]}
thiserror = {workspace = true}
anyhow = {workspace = true}

[dev-dependencies]
criterion = {workspace = true}