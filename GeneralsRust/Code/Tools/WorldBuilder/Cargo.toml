[package]
name = "world_builder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ui_framework = { path = "../UIFramework" }
eframe = { workspace = true }
glam = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
game_engine = { path = "../../GameEngine/Common" }
gamelogic = { path = "../../GameEngine/GameLogic" }

[lib]
name = "world_builder"
path = "src/lib.rs"

[[bin]]
name = "world_builder"
path = "src/main.rs"

[dev-dependencies]
tempfile = {workspace = true}
game_engine = { path = "../../GameEngine/Common", features = ["test-ambient-services"] }
