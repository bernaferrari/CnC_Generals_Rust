[package]
name = "image_packer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "image_packer"
path = "src/lib.rs"

[dependencies]
# UI Framework (simplified for now)
# ui_framework = { path = "../UIFramework" }

# Core dependencies
gpui = {workspace = true, optional = true}

# Image processing and texture packing
image = { workspace = true }
texture_packer = { workspace = true, optional = true }
walkdir = { workspace = true }

# File handling
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }

# Utilities
log = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
anyhow = { workspace = true }
bitflags = { workspace = true }
uuid = { workspace = true, features = ["v4"], optional = true }
chrono = { workspace = true, features = ["serde"], optional = true }

[[bin]]
name = "image_packer"
path = "src/main.rs"
required-features = ["ui"]

[features]
default = []
ui = ["dep:gpui", "dep:rfd", "dep:texture_packer", "dep:serde_json", "dep:log", "dep:env_logger", "dep:uuid", "dep:chrono"]
