[package]
name = "map_cache_builder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "map_cache_builder"
path = "src/lib.rs"

[dependencies]
# Core dependencies
serde = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

# File handling
rfd = { workspace = true, optional = true }
walkdir = { workspace = true }

# CRC calculation
crc32fast = {workspace = true}

game_engine = { path = "../../GameEngine/Common" }


# Optional chrome (egui already in workspace; keep default CLI checkable)
egui = { workspace = true, optional = true }
eframe = { workspace = true, optional = true }

[dev-dependencies]
tempfile = {workspace = true}
game_engine = { path = "../../GameEngine/Common", features = ["test-ambient-services"] }

[[bin]]
name = "map_cache_builder"
path = "src/win_main.rs"

[features]
default = []
debug_output = []
ui = ["egui", "eframe", "rfd"]
