[package]
name = "w3d_to_gltf"
version = "0.1.0"
edition = "2024"
description = "A robust W3D to glTF converter for Command & Conquer Generals"
authors = ["Claude Code"]

[dependencies]
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
glam = { version = "0.28", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
walkdir = "2.4"
rand = "0.8"
base64 = "0.21"
