[package]
name = "particle_editor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# UI Framework
ui_framework = { path = "../UIFramework" }

# Core dependencies
egui = { workspace = true }
eframe = { workspace = true }


# File handling
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rfd = { workspace = true }


# Utilities
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["v4"] }



[lib]
name = "particle_editor"
path = "src/lib.rs"

[[bin]]
name = "particle_editor"
path = "src/main.rs"

[features]
default = []
