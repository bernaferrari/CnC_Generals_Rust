[package]
name = "game_network"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["AI Assistant"]
description = "Modern networking system for Command & Conquer Generals Zero Hour"
license = "GPL-3.0"

[lib]
name = "game_network"
crate-type = ["cdylib", "rlib"]

[dependencies]
bincode_legacy = { workspace = true }
# Async runtime and networking
tokio = {workspace = true, features = ["full", "test-util"]}
async-trait = {workspace = true}

# WebSocket support
tungstenite = {workspace = true}
tokio-tungstenite = {workspace = true, features = ["rustls-tls-native-roots"]}
futures-util = {workspace = true}
url = {workspace = true}
igd = {workspace = true, features = ["aio"], default-features = false}

# QUIC protocol for low-latency networking
quinn = {workspace = true, features = ["rustls"]}
rustls = {workspace = true, features = ["std"]}
rcgen = {workspace = true}

# HTTP/gRPC for matchmaking services
hyper = {workspace = true, features = ["full"]}
reqwest = { workspace = true, features = ["stream"] }

# Serialization
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
bincode = {workspace = true}
rmp-serde = {workspace = true} # MessagePack for efficient binary serialization

# Compression
flate2 = {workspace = true, optional = true}
zstd = {workspace = true, optional = true}
lz4_flex = {workspace = true, optional = true}

# Cryptography and security
ring = {workspace = true, optional = true}
x25519-dalek = {workspace = true, optional = true}
ed25519-dalek = {workspace = true, optional = true}
rand = {workspace = true}
uuid = {workspace = true, features = ["v4", "serde"]}
hex = {workspace = true}

# Additional utilities
crc32fast = {workspace = true}
byteorder = {workspace = true}
once_cell = {workspace = true}
if-addrs = {workspace = true}

# Connection pooling and rate limiting

# Error handling
thiserror = {workspace = true}

# Logging and metrics
tracing = {workspace = true, optional = true}
tracing-subscriber = {workspace = true, features = ["env-filter"], optional = true}
metrics = {workspace = true, optional = true}
metrics-exporter-prometheus = {workspace = true, optional = true}
opentelemetry = {workspace = true, features = ["trace"], optional = true}
opentelemetry_sdk = {workspace = true, features = ["rt-tokio"], optional = true}
opentelemetry_otlp = { workspace = true, optional = true }
tracing-opentelemetry = {workspace = true, optional = true}
console-subscriber = {workspace = true, optional = true}

# Time and utilities
chrono = {workspace = true, features = ["serde"]}
parking_lot = {workspace = true}

# File operations

# Internal dependencies
# rust_game_engine = { path = "../rust_game_engine" }
game_engine = { path = "../Common" }

[dev-dependencies]
tempfile = {workspace = true}

[[bench]]
name = "network_benchmarks"
harness = true

[features]
default = ["secure", "compression", "metrics"]
secure = ["dep:ring", "dep:x25519-dalek", "dep:ed25519-dalek"]
compression = ["dep:flate2", "dep:zstd", "dep:lz4_flex"]
metrics = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:metrics",
    "dep:metrics-exporter-prometheus",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry_otlp",
    "dep:tracing-opentelemetry",
    "dep:console-subscriber"
]
mdns = []
webrtc = []  # Optional WebRTC support
internal = []
nightly_bench = []

[target.'cfg(unix)'.dependencies]
socket2 = { workspace = true }
