[package]
name = "game-client-rust"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Rust conversion of Command & Conquer Generals Zero Hour GameClient"
license = "GPL-3.0-or-later"
authors = ["Command & Conquer Generals Zero Hour Contributors"]
repository = "https://github.com/CnC-Generals-Zero-Hour/CnC_Generals_Zero_Hour"
keywords = ["game", "graphics", "rts", "cnc", "generals"]
categories = ["games", "graphics", "multimedia"]
autoexamples = false


[dependencies]
bincode_legacy = { workspace = true }
# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

ww3d-core = { path = "../../Libraries/Source/WWVegas/WW3D2/crates/ww3d-core" }
ww3d-gpu = { path = "../../Libraries/Source/WWVegas/WW3D2/crates/ww3d-gpu" }
ww3d-assets = { path = "../../Libraries/Source/WWVegas/WW3D2/crates/ww3d-assets" }
ww3d-animation = { path = "../../Libraries/Source/WWVegas/WW3D2/crates/ww3d-animation" }
ww3d-renderer-3d = { path = "../../Libraries/Source/WWVegas/WW3D2/crates/ww3d-renderer-3d" }
game_network_crate = { package = "game_network", path = "../GameNetwork", optional = true }
gamelogic = { path = "../GameLogic" }
game_engine = { path = "../Common" }

# Logging
log = {workspace = true}
env_logger = {workspace = true}

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Utilities
bitflags = {workspace = true}
once_cell = {workspace = true}
parking_lot = { workspace = true }
rand = { workspace = true }
rand_distr = {workspace = true}
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = {workspace = true}
bincode = {workspace = true}
byteorder = { workspace = true }
chrono = { workspace = true }

# 3D Math and linear algebra  
num-traits = {workspace = true}
glam = {workspace = true, features = ["serde"]}
ultraviolet = {workspace = true, features = ["serde", "bytemuck"]}
mint = {workspace = true}

# Graphics and rendering (wgpu is the device backend; do not add Direct3D crates)
wgpu = {workspace = true, features = ["wgsl", "spirv"]}
wgpu-hal = {workspace = true}
winit = {workspace = true}
pollster = {workspace = true}
bytemuck = {workspace = true, features = ["derive"]}
raw-window-handle = {workspace = true}

# Advanced 3D formats and processing
gltf = {workspace = true, features = ["KHR_lights_punctual", "KHR_materials_transmission"]}
meshopt = {workspace = true}
mikktspace = {workspace = true}
# rend3 = { version = "0.3", optional = true }  # Removed due to wgpu version conflicts

# Modern shader compilation
naga = {workspace = true, features = ["wgsl-in", "spv-out", "hlsl-out"]}
# wgsl-analyzer = { version = "0.5", optional = true }  # Removed - package not found

# Image loading and processing
image = {workspace = true, features = ["png", "tga", "jpeg", "bmp", "dds"]}
tiff = {workspace = true}

# Audio support
# Single comprehensive game audio library (replaces cpal + rodio + hound)
kira = {workspace = true, features = ["symphonia", "wav", "ogg", "flac", "mp3"]}
num_cpus = {workspace = true}

# Video playback - using simpler alternatives for now
# ffmpeg-next = { version = "6.0", optional = true }  # Removed due to compilation issues

# UI and text rendering
fontdue = {workspace = true}
cosmic-text = {workspace = true}
fontdb = {workspace = true}

# Input handling
gilrs = {workspace = true}

# File system and compression
walkdir = {workspace = true}
zip = {workspace = true}
lz4 = {workspace = true}
flate2 = {workspace = true}

# Asset system dependencies
notify = {workspace = true}
sha2 = {workspace = true}
crc32fast = {workspace = true}
regex = {workspace = true}
lazy_static = {workspace = true}

# Memory management and performance
memmap2 = {workspace = true}
rayon = {workspace = true}
crossbeam = {workspace = true}
dashmap = {workspace = true}
smallvec = {workspace = true, features = ["serde"]}
bumpalo = {workspace = true}
slotmap = {workspace = true}

# SIMD optimizations  
wide = {workspace = true}
packed_simd_2 = {workspace = true, optional = true}

# Advanced graphics features
spirv-reflect = {workspace = true}
half = {workspace = true, features = ["bytemuck", "serde"]}
noise = {workspace = true}
bracket-noise = {workspace = true}

# Network (for multiplayer support)
quinn = {workspace = true, optional = true}

# Platform-specific dependencies
# Windows `windows` crate (Foundation / Direct3D / DXGI / WASAPI / input) is unused.
# Production GameClient talks to the OS through wgpu + winit + kira only.

# Linux Platform - X11/Wayland, ALSA/PulseAudio, Vulkan support
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
libc = { workspace = true }

# X11 support
x11 = { workspace = true, optional = true }
xcursor = { workspace = true, optional = true }

# Wayland support
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true }

# Cross-platform audio (handled by cpal/rodio in main dependencies)

# Input device support
evdev = { workspace = true, optional = true }

# Hardware detection
udev = { workspace = true, optional = true }

# System integration
dbus = { workspace = true, optional = true }

# macOS Platform - Cocoa, Metal, Core Audio support
[target.'cfg(target_os = "macos")'.dependencies]
# Core Foundation and Cocoa
core-foundation = { workspace = true, optional = true }
cocoa = { workspace = true, optional = true }

# Metal graphics
metal = { workspace = true, optional = true }
objc = { workspace = true, optional = true }

# Audio handled cross-platform by cpal/rodio

# IOKit for hardware access
IOKit-sys = { workspace = true, optional = true }

[dev-dependencies]
approx = {workspace = true}
tempfile = {workspace = true}
criterion = {workspace = true, features = ["html_reports"]}
proptest = {workspace = true}
mockall = {workspace = true}

[features]
# Multiplayer/network remains deferred. Keep the ordinary client build native,
# while requiring an explicit `online_ui`, `network`, or `multiplayer` opt-in.
default = ["platform-native"]
video = []  # Video features temporarily disabled
network = ["dep:game_network_crate"]
multiplayer = ["network", "quinn"]
online_ui = ["network"]
debug_graphics = []
benchmark = []
internal = ["gamelogic/internal"]
allow_surrender = []

# Platform-specific feature flags
platform-native = ["platform-windows", "platform-linux", "platform-macos"]

# Windows platform features
platform-windows = []

# Linux platform features  
platform-linux = ["x11", "wayland", "evdev", "udev", "dbus"]
x11 = ["dep:x11", "dep:xcursor"]
wayland = ["dep:wayland-client", "dep:wayland-protocols"]
# Audio is handled cross-platform by cpal/rodio 
evdev = ["dep:evdev"]
udev = ["dep:udev"]
dbus = ["dep:dbus"]

# macOS platform features
platform-macos = ["cocoa", "metal", "iokit"]
cocoa = ["dep:core-foundation", "dep:cocoa", "dep:objc"]
metal = ["dep:metal", "dep:objc"]
# Audio handled cross-platform by cpal/rodio
iokit = ["dep:IOKit-sys"]

# Cross-platform optional features
async-trait = []

# Advanced W3D rendering features
w3d_support = []
advanced_rendering = []
pbr_rendering = []
deferred_rendering = []
shadow_mapping = []
post_processing = []
compute_shaders = []
tessellation = []
gpu_culling = []
temporal_effects = []
simd_optimizations = ["packed_simd_2"]
mesh_optimization = []
lod_system = []

[lib]
name = "game_client_rust"
path = "src/lib.rs"

[[bin]]
name = "game-client"
path = "src/bin/main.rs"

[[example]]
name = "display_demo"
path = "examples/display_demo.rs"

[[example]]
name = "gui_demo"
path = "examples/gui_demo.rs"

[[bench]]
name = "rendering_benchmark"
harness = false
path = "benches/rendering.rs"
