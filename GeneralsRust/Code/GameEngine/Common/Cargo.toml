[package]
name = "game_engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true


[dependencies]
rodio_compat = { workspace = true }
# Common dependencies for game engine functionality
libc = {workspace = true}
bitflags = {workspace = true}
bit-vec = {workspace = true}
once_cell = {workspace = true}
ahash = {workspace = true}
lazy_static = {workspace = true}
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
uuid = {workspace = true}
chrono = {workspace = true, features = ["serde"]}
regex = {workspace = true}
log = {workspace = true}
memmap2 = {workspace = true}
crossbeam = {workspace = true}
parking_lot = { workspace = true }
tracing = {workspace = true, optional = true}
tracing-subscriber = {workspace = true, features = ["registry"], optional = true}
flate2 = {workspace = true}
tempfile = {workspace = true}
directories = {workspace = true}
serde_json = {workspace = true}

# Random number generation
rand = { workspace = true }
fastrand = {workspace = true}

# Async runtime and futures
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
futures = {workspace = true, optional = true}

# Modern audio libraries for high-quality audio system
rodio = {workspace = true, features = ["symphonia", "wav"]}
cpal = {workspace = true, optional = true}
symphonia = {workspace = true, features = ["all"], optional = true}
# hound = { version = "3.5", optional = true }  # Now required
realfft = {workspace = true, optional = true}
rubato = {workspace = true, optional = true}
# Required dependencies for audio system
crossbeam-channel = {workspace = true}
hound = {workspace = true}
lewton = {workspace = true}
minimp3 = {workspace = true}

# 3D audio and spatial processing
# spatial-audio = { version = "0.3", optional = true }  # Not available
# hrtf = { version = "0.8", optional = true }            # Not available

# Advanced collections and utilities
indexmap = {workspace = true}
smallvec = {workspace = true}
dashmap = {workspace = true}
rayon = {workspace = true}

# Memory management
bumpalo = {workspace = true}
region = {workspace = true}

# System information
num_cpus = {workspace = true}

# String processing
encoding_rs = {workspace = true}
unicode-normalization = {workspace = true}

# Compression
lz4 = {workspace = true, optional = true}
zstd = {workspace = true, optional = true}
crc32fast = {workspace = true}
generals_compression = { workspace = true }
eac_compression = { path = "../../Libraries/Source/Compression/EAC" }

ww3d-animation = { path = "../../Libraries/Source/WWVegas/WW3D2/crates/ww3d-animation" }
ww3d-core = { path = "../../Libraries/Source/WWVegas/WW3D2/crates/ww3d-core" }
glam = { workspace = true }
pollster = { workspace = true }

# System interaction
winapi = {workspace = true, features = ["winuser", "winreg", "processthreadsapi", "handleapi", "errhandlingapi", "minwinbase", "winbase", "winnt"], optional = true}
nix = {workspace = true, optional = true}
sysinfo = { workspace = true, optional = true }

# Graphics system (optional for fallback)
wgpu = {workspace = true, optional = true}
winit = {workspace = true, optional = true}


[features]
default = ["async", "graphics", "audio"]
async = ["tokio", "async-trait", "futures"]
audio = ["cpal", "symphonia", "realfft", "rubato"]
compression = ["lz4", "zstd"]
graphics = ["wgpu", "winit"]
windows = ["winapi"]
unix = ["nix"]
sysinfo = ["dep:sysinfo"]
notify = []
legacy-files = []
test-assets = []
internal = []
allow_anim_inquiries = []
load_test_assets = []
allow_surrender = []
logging = []
backtrace = []
debug_crc = ["tracing", "tracing-subscriber"]
debug = []
perf_timers = []
no_perf_timers = []
deterministic = []

[lib]
name = "game_engine"
path = "src/lib.rs"
test = true

[dev-dependencies]
tokio-test = {workspace = true}
criterion = {workspace = true, features = ["html_reports"]}
