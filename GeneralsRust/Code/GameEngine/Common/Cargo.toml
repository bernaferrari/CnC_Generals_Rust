[package]
name = "game_engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true


[lints]
workspace = true

[dependencies]
generals_game_domain = { path = "../GameDomain" }
generals_fx = { path = "../FX" }

# Common dependencies for game engine functionality
libc = {workspace = true}
bitflags = {workspace = true}
bit-vec = {workspace = true}
once_cell = {workspace = true}
rustc-hash = {workspace = true}
lazy_static = {workspace = true}
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
chrono = {workspace = true, features = ["serde"]}
regex = {workspace = true}
log = {workspace = true}
parking_lot = { workspace = true }
tracing = {workspace = true, optional = true}
tracing-subscriber = {workspace = true, features = ["registry"], optional = true}
flate2 = {workspace = true}
directories = {workspace = true}
serde_json = {workspace = true}

# Async runtime and futures

async-trait = { workspace = true, optional = true }
futures = {workspace = true, optional = true}

# Modern audio libraries for high-quality audio system

cpal = {workspace = true, optional = true}
symphonia = {workspace = true, features = ["all"], optional = true}
# hound = { version = "3.5", optional = true }  # Now required
realfft = {workspace = true, optional = true}
# Required dependencies for audio system
crossbeam-channel = {workspace = true}
hound = {workspace = true}
lewton = {workspace = true}


# 3D audio and spatial processing
# spatial-audio = { version = "0.3", optional = true }  # Not available
# hrtf = { version = "0.8", optional = true }            # Not available

# Advanced collections and utilities
indexmap = {workspace = true}
smallvec = {workspace = true}
dashmap = {workspace = true}

# System information
num_cpus = {workspace = true}

# Compression
lz4 = {workspace = true, optional = true}
zstd = {workspace = true, optional = true}
generals_compression = { workspace = true }
eac_compression = { path = "../../Libraries/Source/Compression/EAC" }

ww3d-animation = { path = "../../Libraries/Source/WWVegas/WW3D2/crates/ww3d-animation" }
ww3d-core = { path = "../../Libraries/Source/WWVegas/WW3D2/crates/ww3d-core" }
glam = { workspace = true }
pollster = { workspace = true }

# System interaction
nix = {workspace = true, optional = true}
sysinfo = { workspace = true, optional = true }

# Graphics system (optional for fallback)
wgpu = {workspace = true, optional = true}
winit = {workspace = true, optional = true}


[features]
# Test-only: per-thread owned CommonServices for tests that never publish a world.
test-ambient-services = []
default = ["async", "graphics", "audio"]
async = ["tokio", "async-trait", "futures"]
audio = ["cpal", "symphonia", "realfft"]
browser-audio = ["audio", "dep:rodio", "dep:rodio_compat", "rodio/wasm-bindgen", "dep:web-time"]
compression = ["lz4", "zstd"]
graphics = ["wgpu", "winit"]
windows = []
unix = ["nix"]
sysinfo = ["dep:sysinfo"]
notify = []
legacy-files = []
test-assets = []
internal = []
allow_anim_inquiries = []
load_test_assets = []
allow_surrender = []
logging = []
backtrace = []
debug_crc = ["tracing", "tracing-subscriber"]
debug = []
perf_timers = ["tracing"]
no_perf_timers = []
deterministic = []

[lib]
name = "game_engine"
path = "src/lib.rs"
test = true

[dev-dependencies]
tempfile = {workspace = true}
# Self dev-dep enables the per-thread owned CommonServices fallback for this
# crate's own unit tests only (same trick gamelogic uses for its dev-deps).
game_engine = { path = ".", features = ["test-ambient-services"] }
tokio-test = {workspace = true}
criterion = {workspace = true, features = ["html_reports"]}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, optional = true }
rodio_compat = { workspace = true }
rodio = { workspace = true, features = ["symphonia", "wav"] }
minimp3 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["rt", "sync", "time", "macros", "io-util"], optional = true }
getrandom_03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4.2", features = ["wasm_js"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
rodio = { workspace = true, optional = true }
rodio_compat = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }

# Native Windows URL launching is compiled by target, independently of features.
[target.'cfg(windows)'.dependencies]
winapi = {workspace = true, features = ["winuser", "winerror", "winreg", "processthreadsapi", "handleapi", "errhandlingapi", "minwinbase", "winbase", "winnt"]}
