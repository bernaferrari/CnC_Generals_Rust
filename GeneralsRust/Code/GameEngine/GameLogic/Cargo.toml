[package]
name = "gamelogic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Game Logic system - Rust conversion of C++ GameLogic for Command & Conquer Generals Zero Hour"
authors = ["C&C Generals Zero Hour Rust Project"]

[lints]
workspace = true

[dependencies]
ww3d-core = { workspace = true }
bincode_legacy = { workspace = true }
# Core dependencies
thiserror = { workspace = true }
log = {workspace = true}
serde = { workspace = true }
serde_json = { workspace = true }
game_engine = { path = "../Common" }
generals-sim = { path = "../Sim" }
game_network = { path = "../GameNetwork", optional = true }

# Math and geometry
math_utilities = { path = "../../Libraries/Source/WWVegas/WWMath" }
glam = {workspace = true, features = ["serde"]}

# Synchronization and collections
parking_lot = {workspace = true}
slotmap = {workspace = true}

# Utilities
once_cell = {workspace = true}
lazy_static = {workspace = true}
scoped-tls = {workspace = true}
bitflags = {workspace = true, features = ["serde"]}

crc32fast = {workspace = true}
futures = {workspace = true}

# Async support

async-trait = {workspace = true}

# Random number generation

# For scripting engine
rhai = {workspace = true, features = ["sync"]}

# Optional profile integration (placeholder - will be implemented as needed)
# profile = { path = "../../Libraries/Source/WWVegas/WWDebug", optional = true }

[dev-dependencies]
game_engine = { path = "../Common", features = ["test-ambient-services"] }
tokio-test = {workspace = true}
tokio = {workspace = true}
criterion = {workspace = true}
proptest = {workspace = true}
env_logger = {workspace = true}

[features]
# Test-only: per-thread owned worlds for tests that never publish one (see engine_stores).
test-ambient-services = ["game_engine/test-ambient-services"]
default = ["async", "ai", "scripting", "legacy_port", "allow_surrender"]
# Compatibility flags mirroring legacy build defines for conditional code paths.
internal = []
legacy_perf_tests = []
count_script_usage = ["game_engine/count_script_usage"]
script_profiling = []
allow_debug_cheats = []
allow_surrender = []
scripting = []
async = []
network = ["dep:game_network"]
ai = []
debug = []
ai_dock = []

# AI features
ai-debug = ["ai"]
pathfinding-debug = []

# Module features
behaviors = []
updates = []
weapons = []
damage = []
modern_behaviors = []

# Performance and debugging features
dump_perf_stats = []
simd = []

# Transitional feature gate for the unfinished direct C++ port.
legacy_port = []
engine_tests = []
