[package]
name = "gamelogic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Game Logic system - Rust conversion of C++ GameLogic for Command & Conquer Generals Zero Hour"
authors = ["C&C Generals Zero Hour Rust Project"]

[lints]
workspace = true

[dependencies]
bincode_legacy = { workspace = true }
# Core dependencies
thiserror = { workspace = true }
log = {workspace = true}
serde = { workspace = true }
serde_json = { workspace = true }
game_engine = { path = "../Common" }
game_network = { path = "../GameNetwork", optional = true }

# Math and geometry
glam = {workspace = true, features = ["serde"]}
cgmath = {workspace = true}

# Synchronization and collections
parking_lot = {workspace = true}
dashmap = {workspace = true}
crossbeam = {workspace = true}
slotmap = {workspace = true}

# Utilities
once_cell = {workspace = true}
lazy_static = {workspace = true}
scoped-tls = {workspace = true}
uuid = {workspace = true, features = ["v4"]}
bitflags = {workspace = true, features = ["serde"]}
num_enum = {workspace = true}

bincode = {workspace = true}
crc32fast = {workspace = true}
futures = {workspace = true}

# Time handling
chrono = {workspace = true, features = ["serde"]}

# Async support
tokio = {workspace = true, features = ["full"]}
async-trait = {workspace = true}

# Random number generation
rand = {workspace = true}
rand_distr = {workspace = true}

# For AI pathfinding algorithms
petgraph = {workspace = true}
pathfinding = {workspace = true}

# For SIMD optimizations
wide = {workspace = true, optional = true}

# For parallel processing
rayon = {workspace = true}
num_cpus = {workspace = true}

# For spatial data structures
kdtree = {workspace = true, optional = true}
rstar = {workspace = true, optional = true}

# For physics calculations
rapier3d = {workspace = true, optional = true}

# For scripting engine
rhai = {workspace = true, features = ["sync"]}

# Optional profile integration (placeholder - will be implemented as needed)
# profile = { path = "../../Libraries/Source/WWVegas/WWDebug", optional = true }

[dev-dependencies]
tokio-test = {workspace = true}
criterion = {workspace = true}
proptest = {workspace = true}
env_logger = {workspace = true}

[features]
default = ["async", "ai", "scripting", "legacy_port", "allow_surrender"]
# Compatibility flags mirroring legacy build defines for conditional code paths.
internal = []
legacy_perf_tests = []
count_script_usage = []
script_profiling = []
allow_debug_cheats = []
allow_surrender = []
scripting = []
async = []
network = ["dep:game_network"]
ai = []
debug = []
ai_dock = []

# AI features
ai-debug = ["ai"]
pathfinding-debug = []

# Module features
behaviors = []
updates = []
weapons = []
damage = []
modern_behaviors = []

# Performance and debugging features
dump_perf_stats = []
simd = ["wide"]
physics = ["rapier3d"]
spatial_optimization = ["kdtree", "rstar"]

# Transitional feature gate for the unfinished direct C++ port.
legacy_port = []
engine_tests = []
