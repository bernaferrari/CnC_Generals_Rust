[package]
name = "game_engine_device"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Westwood Studios <contact@ea.com>"]
description = "GameEngineDevice - Complete hardware abstraction layer for C&C Generals Zero Hour"
license = "GPL-3.0"
repository = "https://github.com/EA/cnc-generals-zero-hour"

[lib]
name = "game_engine_device"
# Quarantine: unused W3D C ABI is not a live cdylib success-stub.
crate-type = ["rlib"]

[features]
default = ["platform-native", "debug"]
# Off by default. DX8-shaped C exports that store handles and return success.
w3d-c-abi = ["w3d"]
audio = ["kira"]
video = [
    "wgpu",
    "wgpu-profiler",
    "winit",
    "naga",
    "raw-window-handle",
    "bytemuck",
    "glam",
    "ww3d-gpu",
    "ww3d-engine",
]
w3d = ["video", "wgpu", "bytemuck", "glam"]
input = ["gilrs"]
platform-native = []
debug = ["log"]

[dependencies]
# Single comprehensive audio library for games
kira = {workspace = true, features = ["symphonia", "wav", "ogg", "flac", "mp3"], optional = true}
rubato = {workspace = true}  # Audio resampling (still needed for real-time processing)
realfft = {workspace = true}  # FFT for audio analysis (still needed for effects)

# Video and graphics dependencies  
wgpu = {workspace = true, features = ["wgsl", "spirv"], optional = true}
wgpu-profiler = {workspace = true, optional = true}
winit = {workspace = true, features = ["serde"], optional = true}
bytemuck = {workspace = true, features = ["derive"], optional = true}
glam = {workspace = true, features = ["bytemuck", "serde"], optional = true}
image = {workspace = true, features = ["png", "jpeg", "tiff", "bmp"]}
naga = {workspace = true, features = ["wgsl-in", "spv-out"], optional = true}
raw-window-handle = {workspace = true, optional = true}

# Async runtime
tokio = {workspace = true, features = ["full"]}
async-trait = {workspace = true}
futures = {workspace = true}

# Utility crates
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = {workspace = true}
uuid = {workspace = true, features = ["v4", "serde"]}
dashmap = {workspace = true}
parking_lot = {workspace = true}
crossbeam-channel = {workspace = true}
rayon = {workspace = true}
bitflags = {workspace = true}  # For modifier key flags
game_client = { path = "../GameClient", package = "game-client-rust" }
game_engine = { path = "../Common" }
ww3d-gpu = { path = "../../Libraries/Source/WWVegas/WW3D2/crates/ww3d-gpu", optional = true }
ww3d-engine = { path = "../../Libraries/Source/WWVegas/WW3D2/crates/ww3d-engine", optional = true }
libc = {workspace = true, optional = true} # Platform syscall bridge for legacy parity paths

# File system operations
walkdir = {workspace = true}        # Directory traversal
ignore = {workspace = true}         # Advanced gitignore-style patterns
memmap2 = {workspace = true}        # Memory-mapped files
notify = {workspace = true}         # File system watching

# Compression and archives
flate2 = {workspace = true}  # Standard zlib
zip = {workspace = true, features = ["deflate"]}
tar = {workspace = true}

# 2025 Performance optimizations
fastrand = {workspace = true}  # Modern, fast random number generation
num_cpus = {workspace = true}  # CPU core detection

# Logging and profiling
log = {workspace = true, optional = true}
tracing = {workspace = true}
tracing-subscriber = {workspace = true, features = ["env-filter"]}

# Platform-specific dependencies
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Media_Audio",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_System_Performance",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_ProcessStatus",
] }
# Modern input handling for Windows
gilrs = { workspace = true, optional = true }
device_query = { workspace = true, optional = true }

# Cross-platform dependencies
gpu-alloc = { workspace = true }

# Note: cpal has been replaced with modern Kira-based audio system
# cpal = "0.15" # Replaced with Kira audio system

[dev-dependencies]
criterion = {workspace = true, features = ["html_reports"]}
tokio-test = {workspace = true}
tempfile = {workspace = true}
proptest = {workspace = true}
mockall = {workspace = true}

# Internal dependencies (placeholder - will be implemented as needed)
# wwaudio = { path = "../Libraries/Source/WWVegas/WWAudio" }
# wpaudio_shared = { path = "../Libraries/Source/WPAudio/shared" }
# ww3d = { path = "../Libraries/Source/WWVegas/WW3D" }
# wwshade = { path = "../Libraries/Source/WWVegas/WWShade" }
# wwmath = { path = "../Libraries/Source/WWVegas/WWMath" }


[[example]]
name = "audio_device_demo"
required-features = ["audio"]

[[example]]
name = "video_device_demo"
required-features = ["video"]

[[example]]
name = "w3d_device_demo"
required-features = ["w3d"]

[[example]]
name = "input_device_demo"
required-features = ["input"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
