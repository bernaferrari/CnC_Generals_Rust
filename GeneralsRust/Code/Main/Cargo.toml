[package]
name = "generals_main"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Default features for a standard game build
default = ["game_client"]

# Core features
game_client = ["dep:game_client"]
network = ["dep:game_network"]

# Platform-specific features
windows = []
macos = []
linux = []

# Development tools and debugging
dev-tools = []
debug-ui = ["dev-tools"]
debug-rendering = ["dev-tools"]
debug-physics = ["dev-tools"]
profiling = []

# Internal development flags
internal = ["game_engine/internal", "game_client?/internal"]
allow_anim_inquiries = []
load_test_assets = []
allow_surrender = []

# Integration and testing
integration-tests = []
native-dialog = ["dep:native-dialog"]

# Graphics backends
vulkan = []
metal = []
dx12 = []
opengl = []

# Optional components
multiplayer = ["network"]
single-player = []
map-editor = ["dev-tools"]
mod-support = []

# Performance options
simd = []
parallel = []
lto = []

# Asset loading
hot-reload = []
compressed-assets = []

[dependencies]
flate2 = { workspace = true }
generals_map = { path = "../GameEngine/Map" }
rodio_compat = { workspace = true }
bincode_legacy = { workspace = true }
# Core game engine dependencies
game_engine = { path = "../GameEngine/Common" }
gamelogic = { path = "../GameEngine/GameLogic" }
generals-sim = { path = "../GameEngine/Sim" }
generals_game_domain = { path = "../GameEngine/GameDomain" }
generals_presentation = { path = "../GameEngine/Presentation" }
game_client = { path = "../GameEngine/GameClient", package = "game-client-rust", optional = true }
game_network = { path = "../GameEngine/GameNetwork", optional = true }

# Graphics and window management
winit = { workspace = true, features = ["serde"] }
wgpu = {workspace = true, features = ["webgpu", "webgl"]}
raw-window-handle = {workspace = true}

# Audio

# Error handling and logging
anyhow = {workspace = true}
log = {workspace = true}
env_logger = {workspace = true}

# Async runtime

async-trait = {workspace = true}
libc = {workspace = true}

# Math
glam = {workspace = true, features = ["serde", "bytemuck"]}

# Additional dependencies for complete integration
ww3d_renderer_3d = { package = "ww3d-renderer-3d", path = "../Libraries/Source/WWVegas/WW3D2/crates/ww3d-renderer-3d" }
ww3d-gpu = { path = "../Libraries/Source/WWVegas/WW3D2/crates/ww3d-gpu" }
ww3d_engine = { package = "ww3d-engine", path = "../Libraries/Source/WWVegas/WW3D2/crates/ww3d-engine" }
ww3d_assets = { package = "ww3d-assets", path = "../Libraries/Source/WWVegas/WW3D2/crates/ww3d-assets" }
ww3d_core = { package = "ww3d-core", path = "../Libraries/Source/WWVegas/WW3D2/crates/ww3d-core" }
ww3d_animation = { package = "ww3d-animation", path = "../Libraries/Source/WWVegas/WW3D2/crates/ww3d-animation" }
pollster = {workspace = true}
bytemuck = {workspace = true, features = ["derive"]}

# BIG file and asset loading dependencies
image = {workspace = true}

# Crossbeam for concurrent data structures
crossbeam = {workspace = true}

# Futures for async utilities
futures = {workspace = true}

# Random number generation for AI behavior

# Network dependencies
serde = {workspace = true, features = ["derive", "rc"]}
bincode = {workspace = true}
crc32fast = {workspace = true}
thiserror = {workspace = true}
serde_json = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }

# Save/Load system dependencies
lz4_flex = {workspace = true}
zstd = {workspace = true}

# Compression / chunk decoding
generals_compression = { path = "../Libraries/Source/Compression" }

# Configuration system

# UI framework dependencies
bitflags = {workspace = true}
font8x8 = {workspace = true}
native-dialog = {workspace = true, optional = true}

[lib]
name = "generals_main"
path = "src/lib.rs"

[[bin]]
name = "generals"
path = "src/main.rs"

[[bin]]
name = "parallel_lone_eagle_gate"
path = "src/bin/parallel_lone_eagle_gate.rs"

[[bin]]
name = "map_frame_gate"
path = "src/bin/map_frame_gate.rs"

[[bin]]
name = "golden_skirmish_gate"
path = "src/bin/golden_skirmish_gate.rs"

[[bin]]
name = "golden_campaign_gate"
path = "src/bin/golden_campaign_gate.rs"


[[bin]]
name = "breadth_gate"
path = "src/bin/breadth_gate.rs"

[[bin]]
name = "release_candidate_gate"
path = "src/bin/release_candidate_gate.rs"

[[bin]]
name = "behavior_gate"
path = "src/bin/behavior_gate.rs"
required-features = ["dev-tools"]

[[bin]]
name = "list_loaded_objects"
path = "src/bin/list_loaded_objects.rs"
required-features = ["dev-tools"]

[[bin]]
name = "deterministic_trace_dump"
path = "src/bin/deterministic_trace_dump.rs"

[[bin]]
name = "deterministic_trace_compare"
path = "src/bin/deterministic_trace_compare.rs"

[[bin]]
name = "deterministic_fixture_trace"
path = "src/bin/deterministic_fixture_trace.rs"

[[bin]]
name = "ai_skirmish_gate"
path = "src/bin/ai_skirmish_gate.rs"

[[bin]]
name = "ai_retail_skirmish_gate"
path = "src/bin/ai_retail_skirmish_gate.rs"

[[bin]]
name = "shell_smoke_gate"
path = "src/bin/shell_smoke_gate.rs"
required-features = ["dev-tools"]

[[bin]]
name = "executable_smoke_gate"
path = "src/bin/executable_smoke_gate.rs"

[[bin]]
name = "boot_shell_menu_gate"
path = "src/bin/boot_shell_menu_gate.rs"

[[bin]]
name = "retail_skirmish_map_gate"
path = "src/bin/retail_skirmish_map_gate.rs"

[[bin]]
name = "player_orders_gate"
path = "src/bin/player_orders_gate.rs"

[[bin]]
name = "retail_save_load_gate"
path = "src/bin/retail_save_load_gate.rs"

[[bin]]
name = "present_frame_gate"
path = "src/bin/present_frame_gate.rs"

[[bin]]
name = "golden_capture"
path = "src/bin/golden_capture.rs"

[[bin]]
name = "generals_multi"
path = "src/bin/generals_multi.rs"

[[bin]]
name = "lone_eagle_bench"
path = "src/bin/lone_eagle_bench.rs"

[[bin]]
name = "facility_cache_gate"
path = "src/bin/facility_cache_gate.rs"


[[example]]
name = "run_exec_smoke"
path = "examples/run_exec_smoke.rs"

[dev-dependencies]
tempfile = {workspace = true}
generals-sim = { path = "../GameEngine/Sim", features = ["test-object-roster", "test-projectile-arena"] }
game_engine = { path = "../GameEngine/Common", features = ["test-ambient-services"] }
gamelogic = { path = "../GameEngine/GameLogic", features = ["test-ambient-services"] }
game_client = { path = "../GameEngine/GameClient", package = "game-client-rust", features = ["test-ambient-services"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Media", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1.1.4", features = ["time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["rt", "sync", "time", "macros", "io-util"] }
web-time = "1.1"
