# Cargo configuration for the single GeneralsRust workspace.
#
# Profiles live in Cargo.toml (Cargo ignores [profile.*] here on stable).
# Do not add a second target-dir for rust-analyzer — that doubles disk use.

[build]
# Let Cargo pick job count from available CPUs. A hardcoded `jobs = 8`
# under-uses bigger machines and over-subscribes smaller ones.
target-dir = "target"

[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=/STACK:8388608",
]

[target.x86_64-pc-windows-gnu]
rustflags = [
    "-C", "link-arg=-Wl,--stack,8388608",
]

# macOS stack size is handled at runtime. `-stack_size` on the linker
# line breaks proc-macro dylibs.
[target.x86_64-apple-darwin]
rustflags = []

[target.aarch64-apple-darwin]
rustflags = []

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "link-arg=-Wl,-z,stack-size=8388608",
]

[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-Wl,-z,stack-size=8388608",
]

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = [
    "-C", "link-arg=-Wl,-z,stack-size=8388608",
]

[env]
RUST_BACKTRACE = "1"
# Keep artifacts in the workspace-wide target directory even when cargo is
# invoked from a nested crate directory.
CARGO_TARGET_DIR = { value = "target", relative = true }

# Prefer narrow crates. `--workspace --all-features` multiplies artifacts
# (features × bins × tests × examples) and is how this tree hit ~70 GB.
[alias]
check-main = "check -p generals_main --all-targets"
check-logic = "check -p gamelogic --all-targets"
check-all = "check --workspace --all-targets"
test-main = "test -p generals_main --lib"
test-all = "test --workspace"
clippy-main = "clippy -p generals_main --all-targets -- -D warnings"
clippy-all = "clippy --workspace --all-targets -- -D warnings"
build-dev = "build -p generals_main"
build-rel = "build -p generals_main --release"
build-windows = "build -p generals_main --target x86_64-pc-windows-msvc --release"
build-macos-x86 = "build -p generals_main --target x86_64-apple-darwin --release"
build-macos-arm = "build -p generals_main --target aarch64-apple-darwin --release"
build-linux = "build -p generals_main --target x86_64-unknown-linux-gnu --release"
build-linux-musl = "build -p generals_main --target x86_64-unknown-linux-musl --release"
test-quick = "test -p generals_main --lib"
clean-all = "clean --workspace"
clean-dev = "clean --profile dev"
