# Profiles — keep target/ bounded. Full debug + packed dSYM previously
# pushed this workspace past ~70 GB (deps/ + incremental + per-hash .dSYM).
[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true

# Dependencies: no debuginfo; mild opts so the game is playable in dev.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Proc-macro / build-script crates: optimize the compilers, not the game.
[profile.dev.build-override]
opt-level = 3
debug = false

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true
[profile.test.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = false
incremental = false

[profile.release-with-debug]
inherits = "release"
debug = "line-tables-only"
strip = false
split-debuginfo = "unpacked"

[profile.bench]
inherits = "release"
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
